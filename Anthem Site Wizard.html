<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Anthem Site Wizard</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&family=DM+Serif+Display&family=Mulish:wght@400;600;700;800&display=swap">
<style>
/* Layout: three-pane workshop. Step rail | step form | live park-site preview. Preview becomes a drawer on narrow screens. */
:root{
  --bg:#EEF2F8; --surface:#FFFFFF; --surface-2:#F5F8FC; --ink:#131C2B; --muted:#56657A; --line:#D6DEEA;
  --accent:#1D4E9A; --accent-ink:#FFFFFF; --accent-soft:#E0E9F7;
  --ok:#2E7A4D; --ok-soft:#E3F2E8; --warn:#9A6208; --warn-soft:#FBF0DB; --crit:#B03E2B; --crit-soft:#FBE6E1;
  --info:#2F5D8A; --info-soft:#E4EDF7;
  --shadow:0 1px 2px rgba(19,28,43,.06),0 6px 24px rgba(19,28,43,.07);
  --f-ui:"Hanken Grotesk",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --top:56px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0D1320; --surface:#151D2C; --surface-2:#1A2436; --ink:#E3EAF5; --muted:#91A0B8; --line:#28344A;
  --accent:#6EA3EC; --accent-ink:#0A1220; --accent-soft:#1A2C48;
  --ok:#62BC86; --ok-soft:#173226; --warn:#E3AA4C; --warn-soft:#382A12; --crit:#EA8169; --crit-soft:#3A1E18;
  --info:#7FAEDD; --info-soft:#18283A; --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 24px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D1320; --surface:#151D2C; --surface-2:#1A2436; --ink:#E3EAF5; --muted:#91A0B8; --line:#28344A;
  --accent:#6EA3EC; --accent-ink:#0A1220; --accent-soft:#1A2C48;
  --ok:#62BC86; --ok-soft:#173226; --warn:#E3AA4C; --warn-soft:#382A12; --crit:#EA8169; --crit-soft:#3A1E18;
  --info:#7FAEDD; --info-soft:#18283A; --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 24px rgba(0,0,0,.25); color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:14px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--surface)}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{text-wrap:balance;margin:0}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--f-mono);font-size:12px}
.muted{color:var(--muted)}
.eyebrow{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
.gutter{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* top bar */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:var(--surface);border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:14px;min-height:var(--top);padding-block:8px;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:9px;font-weight:800;letter-spacing:-.01em;font-size:15px;white-space:nowrap;cursor:pointer;background:none;border:0;padding:0}
.logo svg{flex:none}
.proto{font-size:11px;font-weight:700;color:var(--warn);background:var(--warn-soft);padding:3px 8px;border-radius:999px;white-space:nowrap}
.crumbs{display:flex;align-items:center;gap:6px;color:var(--muted);min-width:0}
.crumbs b{color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top-right{margin-left:auto;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.saved{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px;white-space:nowrap}
.saved i{width:7px;height:7px;border-radius:50%;background:var(--ok);display:inline-block}
.role{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
.role select{padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:var(--surface-2);font-size:13px;color:var(--ink);max-width:220px}

/* buttons, chips */
.btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--surface);padding:8px 13px;border-radius:9px;font-weight:600;cursor:pointer;font-size:13px;white-space:nowrap;text-decoration:none;color:var(--ink)}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.small{padding:5px 9px;font-size:12px;border-radius:7px}
.btn:disabled{opacity:.45;cursor:not-allowed;filter:none}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;padding:3px 8px;border-radius:999px;white-space:nowrap;background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}
.chip.ok{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.chip.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.chip.crit{background:var(--crit-soft);color:var(--crit);border-color:transparent}
.chip.info{background:var(--info-soft);color:var(--info);border-color:transparent}
.chip.accent{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.req{font-family:var(--f-mono);font-size:10.5px;font-weight:500;color:var(--info);background:var(--info-soft);padding:2px 6px;border-radius:5px;white-space:nowrap}
body.hide-tags .req,body.hide-tags .req-row{display:none!important}

/* parks dashboard */
.page{max-width:1180px;margin:0 auto;padding-block:28px 60px;display:grid;gap:22px}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
.page-head h1{font-size:28px;letter-spacing:-.02em;font-weight:800}
.page-head p{margin:4px 0 0;color:var(--muted);max-width:62ch}
.banner{display:flex;align-items:center;gap:14px;padding:14px 16px;border-radius:12px;background:var(--surface);border:1px solid var(--line);flex-wrap:wrap}
.banner .grow{flex:1;min-width:220px}
.banner.resume{border-color:var(--accent);background:var(--accent-soft)}
.alerts{display:grid;gap:8px}
.alert{display:flex;gap:12px;align-items:center;padding:12px 14px;border-radius:10px;background:var(--surface);border:1px solid var(--line);flex-wrap:wrap}
.alert .bar{width:4px;align-self:stretch;border-radius:4px;background:var(--warn);flex:none}
.alert.crit .bar{background:var(--crit)}
.alert .grow{flex:1;min-width:200px}
.tbl-wrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow)}
table.parks{width:100%;border-collapse:collapse;min-width:860px}
table.parks th{text-align:left;font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:700;padding:12px 14px;border-bottom:1px solid var(--line)}
table.parks td{padding:14px;border-bottom:1px solid var(--line);vertical-align:middle;font-variant-numeric:tabular-nums}
table.parks tr:last-child td{border-bottom:0}
table.parks tbody tr{cursor:pointer}
table.parks tbody tr:hover td{background:var(--surface-2)}
.pname{display:flex;align-items:center;gap:10px}
.swatch{width:30px;height:30px;border-radius:8px;flex:none;display:grid;place-items:center;color:#fff;font-weight:800;font-size:12px}
.pname b{display:block}
.pname small{color:var(--muted)}
.prog{display:flex;align-items:center;gap:8px;min-width:150px}
.prog .track{flex:1;height:7px;border-radius:9px;background:var(--surface-2);border:1px solid var(--line);overflow:hidden}
.prog .fill{height:100%;background:var(--accent);border-radius:9px}
.prog span{font-size:12px;color:var(--muted);width:34px;text-align:right}
.new-park{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap;padding:16px;background:var(--surface);border:1px dashed var(--line);border-radius:14px}
.new-park .field{min-width:200px;flex:1}

/* workspace */
.ws{display:grid;grid-template-columns:250px minmax(0,1fr) minmax(0,1.08fr);align-items:start;min-height:calc(100vh - var(--top))}
.rail{position:sticky;top:calc(var(--top) + env(safe-area-inset-top,0px));max-height:calc(100vh - var(--top));overflow:auto;padding:18px 10px 30px 0;padding-left:max(12px,env(safe-area-inset-left,0px));border-right:1px solid var(--line);background:var(--surface)}
.park-card{padding:10px 10px 14px;display:grid;gap:8px;border-bottom:1px solid var(--line);margin-bottom:10px}
.park-card .row{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:var(--muted)}
.park-card h2{font-size:16px;font-weight:800;letter-spacing:-.01em}
.stage-label{font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:700;padding:12px 10px 4px}
.step{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:8px 10px;border-radius:9px;border:0;background:transparent;cursor:pointer;font-size:13.5px;font-weight:500}
.step:hover{background:var(--surface-2)}
.step.on{background:var(--accent-soft);color:var(--accent);font-weight:700}
.step .st{flex:none;width:18px;height:18px;display:grid;place-items:center}
.step .t{flex:1;min-width:0}
.step .lockic{opacity:.6}
.rail-foot{padding:14px 10px 0;display:grid;gap:8px;font-size:12px;color:var(--muted)}
.toggle-row{display:flex;align-items:center;gap:8px;cursor:pointer}

.main{padding-block:22px 80px;padding-inline:24px;min-width:0;display:grid;gap:18px;align-content:start}
.step-head{display:grid;gap:8px}
.step-head .meta{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.step-head h1{font-size:24px;letter-spacing:-.02em;font-weight:800}
.step-head p{margin:0;color:var(--muted);max-width:64ch}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;display:grid;gap:14px;min-width:0}
.card h3{font-size:15px;font-weight:800;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.card .sub{margin:-8px 0 0;color:var(--muted);font-size:13px}
.lockbar{display:flex;gap:10px;align-items:center;padding:10px 14px;border-radius:10px;background:var(--surface-2);border:1px solid var(--line);color:var(--muted);font-size:13px}
.note{padding:10px 14px;border-radius:10px;font-size:13px;display:flex;gap:10px;align-items:flex-start}
.note.warn{background:var(--warn-soft);color:var(--warn)}
.note.info{background:var(--info-soft);color:var(--info)}
.note.ok{background:var(--ok-soft);color:var(--ok)}
.note.crit{background:var(--crit-soft);color:var(--crit)}
.note b{font-weight:700}
.note .grow{flex:1}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.field{display:grid;gap:5px;min-width:0}
.field>span{font-size:12px;font-weight:700;color:var(--muted)}
.field input,.field select,.field textarea{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:9px;background:var(--surface-2);font-size:14px;min-width:0}
.field textarea{min-height:84px;resize:vertical;line-height:1.5}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--accent);background:var(--surface)}
.field input:disabled,.field select:disabled,.field textarea:disabled{opacity:.6;cursor:not-allowed}
.field small{color:var(--muted);font-size:12px}
.field input[type=color]{padding:3px;height:40px;cursor:pointer}
.switch{position:relative;display:inline-block;width:36px;height:21px;flex:none}
.switch input{opacity:0;width:0;height:0;position:absolute}
.switch span{position:absolute;inset:0;border-radius:999px;background:var(--line);transition:.15s;cursor:pointer}
.switch span::after{content:"";position:absolute;left:3px;top:3px;width:15px;height:15px;border-radius:50%;background:var(--surface);transition:.15s;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.switch input:checked+span{background:var(--accent)}
.switch input:checked+span::after{transform:translateX(15px)}
.switch input:disabled+span{opacity:.5;cursor:not-allowed}
.switch input:focus-visible+span{outline:2px solid var(--accent);outline-offset:2px}
.list{display:grid;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.li{display:flex;align-items:center;gap:12px;padding:11px 14px;border-bottom:1px solid var(--line);background:var(--surface);flex-wrap:wrap}
.li:last-child{border-bottom:0}
.li .grow{flex:1;min-width:160px}
.li .grow b{font-weight:600}
.li .grow small{display:block;color:var(--muted);font-size:12px}
.li.child{padding-left:36px;background:var(--surface-2)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;padding:3px;background:var(--surface-2);gap:2px;flex-wrap:wrap}
.seg button{border:0;background:transparent;padding:6px 12px;border-radius:7px;font-weight:600;font-size:13px;cursor:pointer;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.seg button:disabled{cursor:not-allowed}
.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px}
.ph{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surface);display:grid}
.ph .img{aspect-ratio:4/3;max-width:100%;background-size:cover;background-position:center;position:relative}
.ph .img .tag{position:absolute;left:8px;top:8px}
.ph .standin-img::after,.site .is-standin::after{content:"";position:absolute;inset:0;background-image:repeating-linear-gradient(135deg,rgba(255,255,255,.28) 0 10px,transparent 10px 20px);pointer-events:none}
.ph .cap{padding:9px 10px;display:grid;gap:6px}
.ph .cap b{font-size:13px}
.ph .acts{display:flex;gap:6px;flex-wrap:wrap}
.file-btn{position:relative;overflow:hidden}
.file-btn input{position:absolute;inset:0;opacity:0;cursor:pointer}
.file-btn input:disabled{cursor:not-allowed}
.kv{display:grid;grid-template-columns:auto minmax(0,1fr);gap:6px 16px;font-size:13px}
.kv dt{color:var(--muted)}
.kv dd{margin:0;min-width:0;overflow-wrap:anywhere}
.linkbox{font-family:var(--f-mono);font-size:11.5px;color:var(--muted);background:var(--surface-2);border:1px solid var(--line);border-radius:7px;padding:5px 8px;overflow-wrap:anywhere;width:100%}
.score{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.score div{border:1px solid var(--line);border-radius:10px;padding:10px;text-align:center;background:var(--surface-2)}
.score b{display:block;font-size:22px;font-weight:800}
.score small{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.06em}
.pipeline{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.pipe{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--surface-2);display:grid;gap:3px}
.pipe b{font-size:13px}
.pipe small{color:var(--muted);font-size:12px}
.pipe.done{background:var(--ok-soft);border-color:transparent}
.pipe.done b{color:var(--ok)}
.pipe.cur{border-color:var(--accent);background:var(--accent-soft)}
.pipe.cur b{color:var(--accent)}
.months{display:flex;flex-wrap:wrap;gap:6px}
.months button{border:1px solid var(--line);background:var(--surface-2);border-radius:7px;padding:5px 9px;font-size:12px;font-weight:600;cursor:pointer;color:var(--muted)}
.months button.closed{background:var(--crit-soft);color:var(--crit);border-color:transparent}
.footer-nav{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;padding-top:6px}
.step-select{display:none}
.preview-toggle{display:none}
.activity{display:grid;gap:6px;font-size:12.5px}
.activity div{display:flex;gap:8px}
.activity time{color:var(--muted);white-space:nowrap;min-width:86px;font-variant-numeric:tabular-nums}

/* preview pane */
.preview{position:sticky;top:calc(var(--top) + env(safe-area-inset-top,0px));height:calc(100vh - var(--top));display:grid;grid-template-rows:auto minmax(0,1fr) auto;background:var(--surface-2);border-left:1px solid var(--line);min-width:0}
.pv-bar{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line);background:var(--surface);flex-wrap:wrap}
.pv-bar .url{flex:1;min-width:140px;font-family:var(--f-mono);font-size:12px;color:var(--muted);background:var(--surface-2);border:1px solid var(--line);border-radius:7px;padding:5px 10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pv-scroll{overflow:auto;padding:16px}
.pv-frame{margin:0 auto;background:#fff;border-radius:10px;overflow:hidden;box-shadow:var(--shadow);border:1px solid var(--line);max-width:100%}
.pv-frame.phone{width:390px;border-radius:28px;border:8px solid #1a1f2b}
.pv-status{font-family:var(--f-mono);font-size:11.5px;padding:7px 14px;border-top:1px solid var(--line);background:var(--surface);color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-height:32px}
.pv-status b{color:var(--ink);font-weight:500}

.drawer{position:fixed;inset:0;z-index:80;display:flex;justify-content:flex-end;background:rgba(10,16,30,.38)}
.drawer .panel{width:min(520px,100%);height:100%;overflow:auto;background:var(--surface);padding:24px;padding-right:max(24px,env(safe-area-inset-right,0px));padding-top:max(24px,env(safe-area-inset-top,0px));display:grid;gap:16px;align-content:start;box-shadow:var(--shadow)}
.drawer h2{font-size:20px;font-weight:800}
.drawer h3{font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.drawer ul{margin:0;padding-left:18px;display:grid;gap:6px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:90;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:13px;box-shadow:var(--shadow);max-width:min(560px,calc(100% - 32px));overflow-wrap:anywhere}

@media (max-width:1240px){
  .ws{grid-template-columns:230px minmax(0,1fr)}
  .preview{position:fixed;top:0;right:0;bottom:0;height:auto;width:min(620px,100%);z-index:70;transform:translateX(105%);transition:transform .2s ease;box-shadow:var(--shadow);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
  .ws.show-preview .preview{transform:none}
  .preview-toggle{display:inline-flex}
  .pv-close{display:inline-flex!important}
}
@media (max-width:780px){
  .ws{grid-template-columns:minmax(0,1fr)}
  .rail{display:none}
  .step-select{display:block}
  .main{padding-inline:max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-right,0px))}
  .grid2,.grid3{grid-template-columns:minmax(0,1fr)}
  .score{grid-template-columns:repeat(3,minmax(0,1fr))}
  .pipeline{grid-template-columns:repeat(2,minmax(0,1fr))}
  .pv-frame.phone{width:100%;border-width:0;border-radius:10px}
  .crumbs{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ---------- generated park site (shared template, R11) ---------- */
.site{--s-bg:#FFFFFF;--s-ink:#1E2624;--s-muted:#5E6966;--s-line:#E4E7E5;--s-soft:#F5F6F4;
  container-type:inline-size;background:var(--s-bg);color:var(--s-ink);font-family:"Mulish",ui-sans-serif,system-ui,sans-serif;font-size:14px;line-height:1.55}
.site h1,.site h2,.site h3{font-family:"DM Serif Display",Georgia,"Times New Roman",serif;font-weight:400;letter-spacing:-.005em;color:var(--s-ink)}
.site a{color:inherit;text-decoration:none}
.site .s-util{background:var(--sp);color:#fff;font-size:11.5px;display:flex;justify-content:space-between;gap:10px;padding:6px 22px;flex-wrap:wrap}
.site .s-util span{opacity:.92}
.site .s-head{display:flex;align-items:center;gap:16px;padding:12px 22px;border-bottom:1px solid var(--s-line);background:var(--s-bg)}
.site .s-logo{display:flex;align-items:center;gap:9px;min-width:0}
.site .s-logo img{height:38px;width:auto;max-width:150px;object-fit:contain}
.site .s-logo .nm{font-family:"DM Serif Display",Georgia,serif;font-size:19px;line-height:1;color:var(--sp)}
.site .s-logo small{display:block;font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--s-muted);margin-top:3px}
.site .s-nav{display:flex;gap:16px;margin-left:auto;font-weight:700;font-size:12.5px;flex-wrap:wrap;justify-content:flex-end}
.site .s-nav a:hover{color:var(--sp)}
.site .s-burger{display:none;margin-left:auto;width:34px;height:34px;border-radius:8px;border:1px solid var(--s-line);place-items:center}
.site .s-btn{display:inline-flex;align-items:center;gap:6px;background:var(--sa);color:var(--sa-ink);font-weight:800;font-size:12.5px;padding:10px 16px;border-radius:999px;white-space:nowrap;cursor:pointer;border:0}
.site .s-btn.alt{background:transparent;color:inherit;box-shadow:inset 0 0 0 2px currentColor}
.site .s-btn.pri{background:var(--sp);color:#fff}
.site .s-btn.call{background:var(--s-soft);color:var(--s-ink);box-shadow:inset 0 0 0 1px var(--s-line)}
.site .s-hero{position:relative;min-height:330px;display:flex;align-items:flex-end;background-size:cover;background-position:center;color:#fff}
.site .s-hero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.05) 30%,rgba(0,0,0,.55))}
.site .s-hero .in{position:relative;z-index:1;padding:28px 22px;display:grid;gap:12px;max-width:560px}
.site .s-hero h1{color:#fff;font-size:36px;line-height:1.05}
.site .s-hero p{margin:0;opacity:.95;font-size:14.5px}
.site .s-hero .ctas{display:flex;gap:10px;flex-wrap:wrap}
.site .s-season{background:var(--s-soft);border-bottom:1px solid var(--s-line);padding:9px 22px;font-size:12.5px;font-weight:700;color:var(--s-muted)}
.site .s-sec{padding:30px 22px;display:grid;gap:16px}
.site .s-sec.tint{background:var(--sp-soft)}
.site .s-sec h2{font-size:26px;line-height:1.1}
.site .s-kicker{font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;font-weight:800;color:var(--sp)}
.site .s-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:14px}
.site .s-card{border:1px solid var(--s-line);border-radius:14px;overflow:hidden;background:var(--s-bg);display:grid;grid-template-rows:auto 1fr}
.site .s-card .im{aspect-ratio:4/3;max-width:100%;background-size:cover;background-position:center;position:relative}
.site .s-card .bd{padding:12px 13px 14px;display:grid;gap:7px;align-content:start}
.site .s-card h3{font-size:18px}
.site .s-card .price{font-size:12.5px;color:var(--s-muted)}
.site .s-card .price b{color:var(--s-ink);font-size:15px}
.site .s-card .s-btn{justify-self:start;margin-top:4px}
.site .s-band{display:grid;grid-template-columns:1.2fr 1fr;gap:18px;align-items:center;padding:30px 22px;background:var(--sp);color:#fff}
.site .s-band h2{color:#fff;font-size:26px}
.site .s-band p{margin:0;opacity:.92}
.site .s-band .s-btn{background:#fff;color:var(--sp)}
.site .s-events{display:grid;gap:8px}
.site .s-ev{display:flex;gap:12px;align-items:center;border:1px solid var(--s-line);border-radius:12px;padding:10px 12px;background:var(--s-bg)}
.site .s-ev .dt{width:46px;text-align:center;border-radius:9px;background:var(--sp-soft);color:var(--sp);padding:5px 0;font-weight:800;line-height:1.1;font-size:11px}
.site .s-ev .dt b{display:block;font-size:18px}
.site .s-map{border-radius:14px;overflow:hidden;border:1px solid var(--s-line);aspect-ratio:16/9;max-width:100%;background-size:cover;background-position:center;position:relative}
.site .s-foot{background:#1B2422;color:#D7DEDB;padding:26px 22px;display:grid;grid-template-columns:1.2fr 1fr 1fr;gap:18px;font-size:12.5px}
.site .s-foot b{color:#fff;display:block;margin-bottom:6px}
.site .s-foot a{display:block;opacity:.85;margin-bottom:3px}
.site .s-foot .anth{grid-column:1/-1;border-top:1px solid rgba(255,255,255,.12);padding-top:12px;font-size:11px;opacity:.7;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.site .standin{background-color:#D9DDDB;background-image:repeating-linear-gradient(135deg,rgba(255,255,255,.35) 0 10px,transparent 10px 20px)}
.site .stand-tag,.ph .stand-tag{position:absolute;left:8px;top:8px;z-index:2;background:#FFD666;color:#4A3500;font-family:"JetBrains Mono",ui-monospace,monospace;font-size:10px;font-weight:500;padding:2px 6px;border-radius:5px}
.site .ph-text{background:#FFF3C4;color:#4A3500;border-radius:4px;padding:0 4px;font-family:"JetBrains Mono",ui-monospace,monospace;font-size:.7em;vertical-align:middle}
.site [data-href]{cursor:pointer}
@container (max-width:620px){
  .site .s-nav{display:none}
  .site .s-burger{display:grid}
  .site .s-head .s-btn{display:none}
  .site .s-hero h1{font-size:29px}
  .site .s-band{grid-template-columns:1fr}
  .site .s-foot{grid-template-columns:1fr}
  .site .s-util{padding-inline:16px}

  .site .s-hero .in{padding-inline:16px}
}

/* ================= computed ================= */
const on = (p,id) => !!p.pages[id];
const units = p => PAGES.filter(pg=>pg.unit && on(p,pg.id));
function usedSlots(p){ return PHOTO_SLOTS.filter(s=>on(p,s.page)); }
function placeholders(p){
  const list = usedSlots(p).filter(s=>!p.photos[s.id]).map(s=>s.label);
  if (on(p,'map') && !(p.map.uploaded && p.map.overlay==='ready')) list.push('Park map');
  if (!p.copy.headline.trim()) list.push('Home headline');
  if (!p.copy.intro.trim()) list.push('Home intro');
  return list;
}
function deepLink(p, unit){
  const code = unit ? unit.code : '';
  if (p.platform==='campspot') return `https://www.campspot.com/book/${p.booking.campspotSlug||'park-slug'}${code?`?siteType=${code}`:''}`;
  return `https://book.newbook.cloud/${p.booking.propertyId||'property-id'}/availability${code?`?category=${code}`:''}`;
}
function bookingReady(p){ return p.platform==='campspot' ? !!p.booking.campspotSlug : !!p.booking.propertyId; }
function stepStatus(p, id){
  switch(id){
    case 'diligence': { const v=Object.values(p.diligence); const r=v.filter(x=>x.status==='received').length; return r===v.length?'done':r?'partial':'todo'; }
    case 'intake': { const f=p.intake.fields; if (p.launch.stage==='live' && !f.length) return 'done'; if(!f.length) return 'todo'; return f.some(x=>x.state==='pending')?'partial':'done'; }
    case 'pages': return p.copy.headline.trim() && p.copy.intro.trim() ? 'done' : (p.copy.headline.trim()||p.copy.intro.trim())?'partial':'todo';
    case 'brand': return p.brand.logoText.trim() && p.brand.primary && p.brand.accent ? 'done' : 'todo';
    case 'photos': { const u=usedSlots(p); const have=u.filter(s=>p.photos[s.id]).length; return have===u.length?'done':have?'partial':'todo'; }
    case 'map': if(!on(p,'map')) return 'done'; return p.map.uploaded && p.map.overlay==='ready' ? 'done' : p.map.uploaded ? 'partial':'todo';
    case 'booking': { if(!bookingReady(p)) return 'todo'; const needPhone = !p.booking.phone || (on(p,'events') && !p.booking.eventsPhone); return needPhone?'partial':'done'; }
    case 'pricing': { if(!p.pricing.showPrices) return 'done'; const u=units(p); const have=u.filter(x=>p.pricing.units[x.id].night).length; return u.length&&have===u.length?'done':have?'partial':'todo'; }
    case 'domain': { const d=p.domain; const n=[d.owner,d.dns,d.ssl,d.redirects].filter(Boolean).length; return n===4?'done':n?'partial':'todo'; }
    case 'launch': return p.launch.stage==='live'?'done':p.launch.stage==='draft'?'todo':'partial';
    case 'stage2': return 'later';
    case 'team': return 'done';
  }
}
function stage1Pct(p){
  const v = {done:1, partial:.5, todo:0};
  return Math.round(STAGE1.reduce((a,id)=>a+v[stepStatus(p,id)],0)/STAGE1.length*100);
}
function parkStatus(p){
  if (p.launch.stage==='live') return {label:'Live', cls:'ok'};
  if (p.launch.stage==='preview' || p.launch.stage==='soft') return {label: p.launch.stage==='soft'?'Soft launch':'QC preview', cls:'info'};
  if (!p.closedOn) return {label:'Under contract', cls:''};
  return {label:'Building', cls:'accent'};
}
function checks(p){
  const c = [];
  const add = (ok, level, text, step) => c.push({ok, level, text, step});
  add(stepStatus(p,'intake')==='done', 'block', 'Pre-fill run and every field reviewed', 'intake');
  add(stepStatus(p,'brand')==='done', 'block', 'Logo and park colors set', 'brand');
  add(!!p.copy.headline.trim(), 'block', 'Home page headline written', 'pages');
  add(bookingReady(p), 'block', `${p.platform==='campspot'?'Campspot':'Newbook'} account connected, deep link for every stay type`, 'booking');
  add(!!p.booking.phone, 'block', 'Reservations phone number set for call-in fallbacks', 'booking');
  if (on(p,'events')) add(!!p.booking.eventsPhone, 'block', 'Events phone set (weddings and events are call-in only)', 'booking');
  add(stepStatus(p,'pricing')==='done', 'warn', 'Rates for every stay type (or prices hidden)', 'pricing');
  const ph = usedSlots(p).filter(s=>!p.photos[s.id]).length;
  add(ph===0, 'warn', ph ? `${ph} section${ph>1?'s':''} will launch with stand-in photos` : 'Real photos in every section', 'photos');
  if (on(p,'map')) add(p.map.overlay==='ready', 'warn', 'Branded park map ready', 'map');
  add(p.domain.dns && p.domain.ssl, 'live', 'Domain pointed and SSL issued (needed for Live only)', 'domain');
  add(p.domain.redirects, 'live', 'Old-site redirects in place', 'domain');
  return c;
}

/* ---------- workspace ---------- */
function workspace(){
  const p = park(); const step = STEPS.find(s=>s.id===S.step) || STEPS[0];
  let lastStage = '';
  const rail = STEPS.map(s=>{
    const head = s.stage!==lastStage ? `<div class="stage-label">${s.stage}</div>` : ''; lastStage = s.stage;
    const st = stepStatus(p,s.id);
    return head + `<button class="step ${s.id===S.step?'on':''}" data-act="step" data-step="${s.id}" aria-current="${s.id===S.step?'step':'false'}"><span class="st">${ICON[st]}</span><span class="t">${s.title}</span>${canEdit(s.id)||s.id==='pages'&&S.role==='onsite'?'':`<span class="lockic">${ICON.lock}</span>`}</button>`;
  }).join('');
  const st = parkStatus(p), pct = stage1Pct(p);
  const dayChip = p.launch.stage==='live' ? `Live since ${fmtDate(p.launch.liveOn)}` : p.closedOn ? `Day ${days(D(p.closedOn),TODAY)} of 14` : 'Under contract';
  const last = p.activity[p.activity.length-1];
  return `<div class="ws ${ui.showPreview?'show-preview':''}">
    <aside class="rail" aria-label="Wizard steps">
      <div class="park-card">
        <div class="row"><span class="chip ${st.cls}">${st.label}</span><span>${dayChip}</span></div>
        <h2>${esc(p.name)}</h2>
        <div class="prog"><div class="track"><div class="fill" style="width:${pct}%"></div></div><span>${pct}%</span></div>
        <div class="row"><span>Stage 1 complete</span><span>${p.platform==='campspot'?'Campspot':'Newbook'}</span></div>
      </div>
      ${rail}
      <div class="rail-foot">
        <label class="toggle-row"><span class="switch"><input type="checkbox" id="tags-toggle" data-act="toggle-tags" ${S.showTags?'checked':''}><span></span></span>Show requirement tags</label>
        ${last?`<span>Last edit: ${esc(last.who)}, ${fmtDay(last.when)}</span>`:''}
      </div>
    </aside>
    <main class="main">
      <select class="step-select" id="step-select" data-act="step-select" aria-label="Wizard step" style="padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--surface)">
        ${STEPS.map(s=>`<option value="${s.id}" ${s.id===S.step?'selected':''}>${s.stage} · ${s.title}</option>`).join('')}
      </select>
      <div class="step-head">
        <div class="meta"><span class="eyebrow">${step.stage}</span>
          <span class="chip" title="Automation level is proposed. Bob, Melisa and Connor still owe the client this rating (Q4).">Proposed: ${step.auto}</span>
          ${REQS(step.reqs)}
          <span style="margin-left:auto"></span>
          <button class="btn small preview-toggle" data-act="preview-open">${ICON.eye} Preview site</button>
        </div>
        <h1>${step.title}</h1>
        <p>${step.lede}</p>
      </div>
      ${!canEdit(step.id) && !(step.id==='pages' && S.role==='onsite') ? `<div class="lockbar">${ICON.lock} View only for on-site managers. Ask the Anthem team to change this step. <span class="req">R24</span></div>`:''}
      ${FORMS[step.id](p, !canEdit(step.id))}
      <div class="footer-nav">${navButtons()}</div>
    </main>
    <aside class="preview" aria-label="Live site preview">${previewPane(p)}</aside>
  </div>`;
}
function navButtons(){
  const i = STEPS.findIndex(s=>s.id===S.step);
  const prev = STEPS[i-1], next = STEPS[i+1];
  return `${prev?`<button class="btn" data-act="step" data-step="${prev.id}">← ${prev.title}</button>`:'<span></span>'}
          ${next?`<button class="btn primary" data-act="step" data-step="${next.id}">Save and continue: ${next.title} →</button>`:''}`;
}

/* field helpers bound to the current park */
function inp(path, label, o={}){
  const v = getPath(park(), path) ?? '';
  return `<label class="field"><span>${label}</span><input id="f-${path}" type="${o.type||'text'}" data-bind="${path}" value="${esc(v)}" placeholder="${esc(o.ph||'')}" ${o.ro?'disabled':''} ${o.mode?`inputmode="${o.mode}"`:''}>${o.hint?`<small>${o.hint}</small>`:''}</label>`;
}
function area(path, label, o={}){
  const v = getPath(park(), path) ?? '';
  return `<label class="field"><span>${label}</span><textarea id="f-${path}" data-bind="${path}" placeholder="${esc(o.ph||'')}" ${o.ro?'disabled':''}>${esc(v)}</textarea>${o.hint?`<small>${o.hint}</small>`:''}</label>`;
}
function sw(path, o={}){
  return `<span class="switch"><input type="checkbox" id="f-${path}" data-check="${path}" ${getPath(park(),path)?'checked':''} ${o.ro?'disabled':''} aria-label="${esc(o.label||path)}"><span></span></span>`;
}

  return `<div class="note ${n===DILIGENCE.length?'ok':'info'}"><div class="grow"><b>${n} of ${DILIGENCE.length} items received.</b> When every item is in, the wizard can run without asking for anything more.</div></div>

    <select id="dil-${k}" data-bind="diligence.${k}.status" ${ro?'disabled':''} style="padding:6px 8px;border-radius:8px;border:1px solid var(--line);background:var(--surface-2)">

launch(p, ro){
  const c = checks(p);

  const stages = [['draft','Draft','Wizard in progress'],['preview','QC preview','SageCreek checks the build'],['soft','Soft launch','Staging link for Anthem review'],['live','Live','On the park’s domain']];
  const idx = stages.findIndex(s=>s[0]===p.launch.stage);
  const row = x => `<div class="li"><span class="st">${x.ok?ICON.done:x.level==='block'?'<svg width="18" height="18" viewBox="0 0 18 18"><circle cx="9" cy="9" r="8" fill="var(--crit)"/><path d="M6 6l6 6M12 6l-6 6" stroke="var(--surface)" stroke-width="1.8" stroke-linecap="round"/></svg>':ICON.partial}</span><div class="grow"><b>${esc(x.text)}</b><small>${x.ok?'Done':x.level==='block'?'Must fix before QC preview':x.level==='live'?'Must fix before going live':'Can launch with this. Tracked after launch.'}</small></div>${x.ok?'':`<button class="btn small" data-act="step" data-step="${x.step}">Fix</button>`}</div>`;
  let action = '';
  if (p.launch.stage==='draft') action = `<button class="btn primary" data-act="advance" ${blocks||S.role==='onsite'?'disabled':''}>Send to QC preview</button>${blocks?`<small class="muted">${blocks} item${blocks>1?'s':''} must be fixed first.</small>`:''}`;
  else if (p.launch.stage==='preview') action = `<button class="btn primary" data-act="advance" ${S.role==='onsite'?'disabled':''}>Soft launch on staging link</button><button class="btn" data-act="back-stage">Back to draft</button>`;
  else if (p.launch.stage==='soft') action = `<button class="btn primary" data-act="advance" ${!canApproveLaunch()||liveBlocks?'disabled':''}>Approve and go live</button>${!canApproveLaunch()?'<small class="muted">Only the Anthem team can approve launch.</small>':liveBlocks?`<small class="muted">Finish the domain steps first.</small>`:''}<button class="btn" data-act="back-stage">Back to QC preview</button>`;
  else { const d = days(D(p.launch.liveOn), TODAY); const ph = placeholders(p); action = `<span class="chip ok">Live since ${fmtDate(p.launch.liveOn)}, approved by ${esc(p.launch.approvedBy)}</span>${ph.length?`<small class="muted">${ph.length} stand-in${ph.length>1?'s':''} live. Day-30 alert ${d>=30?'is showing now':'on '+fmtDate(new Date(D(p.launch.liveOn).getTime()+30*86400000))}.</small>`:''}`; }
  return `<div class="card"><h3>Staged launch ${REQS(['R8'])}</h3>
    <div class="pipeline">${stages.map((s,i)=>`<div class="pipe ${i<idx||p.launch.stage==='live'&&i===idx?'done':i===idx?'cur':''}"><b>${s[1]}</b><small>${s[2]}</small></div>`).join('')}</div>
    ${p.launch.stage==='soft'?`<div class="field"><span>Staging link</span><div class="linkbox">https://${esc(p.id)}.anthem-preview.example</div></div>`:''}
    <div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center">${action}</div>
  </div>
  <div class="card"><h3>Launch checklist ${REQS(['R4','R5'])}</h3>
    <p class="sub">The site can go live before every input is in. Stand-ins are allowed and tracked.</p>

let toastTimer;
function toast(msg){ ui.toast = msg; render(); clearTimeout(toastTimer); toastTimer = setTimeout(()=>{ ui.toast=null; const t=document.querySelector('.toast'); if (t) t.remove(); }, 3200); }
function go(parkId, step){
  if (parkId) S.parkId = parkId;
  S.view = 'park';
  if (step) S.step = step;
  else { const p = park(); S.step = (p.launch.stage==='live') ? 'launch' : (['diligence','intake',...STAGE1,'launch'].find(s=>stepStatus(p,s)!=='done') || 'launch'); }
  ui.showPreview = false;
  save(); render(); window.scrollTo(0,0);
}
function touch(what){ logActivity(what); save(); refreshPreview(); refreshRail(); }

app.addEventListener('click', e=>{
  const t = e.target.closest('[data-act]');
  // preview links: show where they go instead of navigating
  const link = e.target.closest('.site [data-href]');
  if (link){ e.preventDefault(); const h=link.dataset.href; toast(`On the live site this opens: ${esc(h.startsWith('tel:')?'a call to '+h.slice(4):h)}`); return; }
  if (!t) return;
  const a = t.dataset.act, p = S.view==='park'?park():null;
  if (t.tagName==='SELECT' || (t.tagName==='INPUT' && t.type!=='checkbox')) return;
  switch(a){
    case 'home': S.view='parks'; save(); render(); break;
    case 'open': go(t.dataset.park, t.dataset.step); break;
    case 'step': S.step=t.dataset.step; ui.showPreview=false; save(); render(); window.scrollTo(0,0); break;
    case 'notes': ui.notes=true; render(); break;
    case 'notes-close': if (e.target===t || t.tagName==='BUTTON'){ ui.notes=false; render(); } break;
    case 'toggle-tags': S.showTags=!S.showTags; save(); render(); break;
    case 'preview-open': ui.showPreview=true; render(); break;
    case 'preview-close': ui.showPreview=false; render(); break;
    case 'device': S.device=t.dataset.v; save(); render(); break;
    case 'toast': toast(esc(t.dataset.msg)); break;
    case 'reset': try{localStorage.removeItem(STORE_KEY);}catch(_){} S=seed(); ui.notes=false; render(); toast('Sample data reset.'); break;
    case 'intake': { const f=p.intake.fields[+t.dataset.i]; f.state=t.dataset.state; if (f.state==='edited' && f.final==null) f.final=f.value; logActivity('Reviewed pre-filled fields'); save(); render(); break; }
    case 'run-prefill': {
      if (!p.intake.oldUrl) { toast('Enter the old site address first.'); break; }
      p.intake.fields = [
        {label:'Park name', value:p.name, source:'Old site header', state:'pending'},
        {label:'Phone', value:'(555) 010-0000', source:'Old site footer', state:'pending'},
        {label:'Site types', value:'RV sites, Tent sites', source:'Booking categories', state:'pending'},
        {label:'Amenities', value:'Pool, playground, camp store', source:'Old site amenities page', state:'pending'}];
      p.intake.score = {traffic:'C',ads:'F',social:'D',seo:'D',geo:'F'}; p.intake.archived = TODAY.toISOString();
      logActivity('Ran pre-fill from old site'); save(); render(); toast('Pre-fill ran on sample data. Review each field.'); break; }
    case 'draft-copy': p.copy.headline = p.copy.headline || `Room to roam at ${p.name}`; p.copy.intro = p.copy.intro || `${units(p).map(x=>x.label).join(', ') || 'Campsites'} with ${['funcenter','beach','marina','golf'].filter(k=>on(p,k)).map(k=>PAGES.find(x=>x.id===k).label.toLowerCase()).join(', ') || 'plenty to do'} for the whole crew.`; logActivity('Drafted home copy'); save(); render(); break;
    case 'preset': p.brand.primary=t.dataset.p; p.brand.accent=t.dataset.a; logActivity('Changed park colors'); save(); render(); break;
    case 'clear': setPath(p, t.dataset.path, null); logActivity('Removed a file'); save(); render(); break;
    case 'sample-photo': p.photos[t.dataset.slot]={src:'scene'}; logActivity('Added photos'); save(); render(); break;
    case 'map-style': p.map.style=t.dataset.style; save(); render(); break;
    case 'gen-map': p.map.overlay='generating'; render(); setTimeout(()=>{ p.map.overlay='ready'; logActivity('Generated map overlay'); save(); if (S.step==='map') render(); else refreshPreview(); }, 1400); break;
    case 'platform': p.platform=t.dataset.v; logActivity(`Switched booking to ${t.dataset.v==='campspot'?'Campspot':'Newbook'}`); save(); render(); toast(`Booking links for ${esc(p.name)} now point to ${t.dataset.v==='campspot'?'Campspot':'Newbook'}. Other parks are unchanged.`); break;
    case 'sq-mode': p.booking.square[t.dataset.k].mode=t.dataset.v; logActivity('Updated other bookables'); save(); render(); break;
    case 'month': { const i=+t.dataset.i, c=p.pricing.closed; const k=c.indexOf(i); k>=0?c.splice(k,1):c.push(i); logActivity('Updated closed months'); save(); render(); break; }
    case 'advance': { const order=['draft','preview','soft','live']; const i=order.indexOf(p.launch.stage); p.launch.stage=order[i+1]; if (p.launch.stage==='live'){ p.launch.liveOn=TODAY.toISOString(); p.launch.approvedBy=ROLES[S.role].who; } logActivity(`Moved launch to ${p.launch.stage}`); save(); render(); if (p.launch.stage==='live') toast(`${esc(p.name)} is live (in the prototype).`); break; }
    case 'back-stage': { const order=['draft','preview','soft','live']; p.launch.stage=order[Math.max(0,order.indexOf(p.launch.stage)-1)]; save(); render(); break; }
  }
});
app.addEventListener('keydown', e=>{
  const tr = e.target.closest('tr[data-act="open"]');
  if (tr && (e.key==='Enter' || e.key===' ')){ e.preventDefault(); go(tr.dataset.park); }
  if (e.key==='Escape' && (ui.notes || ui.showPreview)){ ui.notes=false; ui.showPreview=false; render(); }
});
app.addEventListener('input', e=>{
  const el = e.target;
  if (el.dataset.ui){ ui[el.dataset.ui] = el.value; return; }
  if (el.dataset.bind && el.tagName!=='SELECT'){
    setPath(park(), el.dataset.bind, el.value);
    const step = STEPS.find(s=>s.id===S.step);
    touch(`Edited ${step.title}`);
  }
});
app.addEventListener('change', e=>{
  const el = e.target;
  if (el.id==='role-select'){
    S.role = el.value;
    if (S.role==='onsite'){ S.parkId='triple-r'; if (S.view==='park' && !canEdit(S.step) && S.step!=='pages') S.step='photos'; }
    save(); render(); toast(`Viewing as ${esc(ROLES[S.role].label)}. ${esc(ROLES[S.role].blurb)}`); return;
  }
  if (el.id==='step-select'){ S.step = el.value; save(); render(); window.scrollTo(0,0); return; }
  if (el.dataset.ui){ ui[el.dataset.ui] = el.value; return; }
  if (el.dataset.check){
    setPath(park(), el.dataset.check, el.checked);
    touch(`Edited ${STEPS.find(s=>s.id===S.step).title}`); render(); return;
  }
  if (el.tagName==='SELECT' && el.dataset.bind){ setPath(park(), el.dataset.bind, el.value); touch('Updated diligence packet'); render(); return; }
  if (el.dataset.bind && el.type==='color'){ render(); return; }
  if (el.dataset.upload && el.files && el.files[0]){
    const path = el.dataset.upload, file = el.files[0];
    const r = new FileReader();
    r.onload = () => {
      const p = park();
      if (path==='brand.logoData') p.brand.logoData = r.result;
      else if (path==='map.upload'){ p.map.upload = file.type.startsWith('image/') ? r.result : null; p.map.uploaded = true; p.map.overlay='none'; }
      else setPath(p, path, {src:r.result});
      logActivity(path.startsWith('photos')?'Added photos':path==='map.upload'?'Uploaded park map':'Uploaded logo');
      save(); render();
    };
    r.readAsDataURL(file);
  }
});
app.addEventListener('submit', e=>{
  e.preventDefault();
  if (e.target.dataset.form==='new-park'){
    const name = (ui.newName||'').trim(); if (!name){ toast('Enter a park name.'); return; }
    let id = name.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'') || 'park'; while (S.parks[id]) id += '-2';
    const np = basePark(id, name); np.platform = ui.newPlatform; np.location = 'Under contract';
    S.parks[id] = np; S.order.push(id); ui.newName=''; S.parkId=id;
    logActivity('Started diligence packet'); go(id, 'diligence');
  }
});
app.addEventListener('mouseover', e=>{
  const l = e.target.closest('.site [data-href]'); const st = document.getElementById('pv-status'); if (!st) return;
  if (l){ const h=l.dataset.href; st.innerHTML = h.startsWith('tel:') ? `Calls <b>${esc(h.slice(4))}</b>` : h.startsWith('http') ? `Opens <b>${esc(h)}</b>` : `Goes to page <b>${esc((park().domain.name||'')+h)}</b>`; }
});

render();
})();
</script>

</body></html>
